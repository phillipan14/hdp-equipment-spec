<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Human Data Partnership</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --text: rgba(255,255,255,0.90);
  --text-dim: rgba(255,255,255,0.38);
  --accent: #00d4aa;
  --border: rgba(255,255,255,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.check {
  width: 64px;
  height: 64px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 32px;
  opacity: 0;
  animation: pop 0.5s 0.1s ease-out forwards;
}
.check svg {
  stroke: var(--accent);
  stroke-width: 2.5;
  fill: none;
  width: 28px;
  height: 28px;
}
h1 {
  font-size: clamp(28px, 4vw, 40px);
  font-weight: 300;
  letter-spacing: -0.03em;
  margin-bottom: 14px;
  opacity: 0;
  animation: fadeUp 0.6s 0.25s ease-out forwards;
}
p {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.7;
  max-width: 400px;
  opacity: 0;
  animation: fadeUp 0.6s 0.4s ease-out forwards;
}
a {
  display: inline-block;
  margin-top: 32px;
  padding: 12px 28px;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: border-color 0.2s, background 0.2s;
  opacity: 0;
  animation: fadeUp 0.6s 0.55s ease-out forwards;
}
a:hover {
  border-color: rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
}
footer {
  position: absolute;
  bottom: 40px;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pop {
  0% { opacity: 0; transform: scale(0.5); }
  70% { transform: scale(1.08); }
  100% { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>
  <div class="check">
    <svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>
  </div>
  <h1>We'll be in touch.</h1>
  <p>Thanks for reaching out. We typically respond within 24 hours.</p>
  <a href="/">Back to site</a>
  <footer>&copy; 2026 Human Data Partnership</footer>
</body>
</html>
